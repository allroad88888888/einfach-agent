<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Browser Agent UI Fixture</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{padding:24px;background:#eef1f7;color:#202532;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
    .fixture-layout{display:grid;grid-template-columns:minmax(360px,680px) minmax(300px,440px);align-items:start;justify-content:center;gap:18px;max-width:1160px;margin:auto}
    #root{height:calc(100vh - 48px);min-height:640px;min-width:0;overflow:hidden;border:1px solid #dfe3ec;border-radius:16px;background:#f6f7fb;box-shadow:0 18px 50px rgba(32,37,50,.10)}
    .fixture-business-column{display:grid;gap:10px}.fixture-business-heading{padding:4px 2px}.fixture-business-heading h1{margin:0;font-size:16px}.fixture-business-heading p,.fixture-preview-note{margin:3px 0 0;color:#667085;font-size:12px}
    #business-fixture{display:grid;gap:12px;padding:12px;border:1px solid #dfe3ec;border-radius:14px;background:#fff}
    #business-fixture iframe{width:100%;height:52vh;border:1px solid #e7eaf1;border-radius:10px;background:#fff}
    #business-fixture section{padding:12px;border-top:1px solid #e7eaf1}#business-fixture pre{white-space:pre-wrap}
    .fixture-narrow body{padding:20px;background:#eef1f7}.fixture-narrow .fixture-layout{display:block;width:360px;margin:auto}.fixture-narrow #root{width:360px;height:calc(100vh - 76px);min-height:560px}.fixture-narrow .fixture-business-column{display:none}.fixture-narrow-note{display:none}.fixture-narrow .fixture-narrow-note{display:block;width:360px;margin:8px auto 0;color:#667085;font-size:12px;text-align:center}
    @media(max-width:760px){body{padding:0}.fixture-layout{display:block}.fixture-business-column{display:none}#root{height:100vh;min-height:0;border:0;border-radius:0;box-shadow:none}}
    @media(max-width:360px){.fixture-narrow body{padding:0}.fixture-narrow .fixture-layout,.fixture-narrow #root,.fixture-narrow .fixture-narrow-note{width:100%}.fixture-narrow #root{height:calc(100vh - 42px);border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="fixture-layout">
    <div id="root"></div>
    <div class="fixture-business-column">
      <header class="fixture-business-heading"><h1>演示业务页面</h1><p>Agent 工具只访问下方隔离的业务 iframe。</p></header>
      <aside id="business-fixture" aria-label="隔离的演示业务页面"></aside>
      <p class="fixture-preview-note">模型请求使用模拟响应，请勿输入真实 API Key。</p>
    </div>
  </main>
  <p class="fixture-narrow-note">模型请求使用模拟响应，请勿输入真实 API Key。</p>
  <script type="module" src="./fixture.testFixtures.tsx"></script>
</body>
</html>
