[package]
name = "einfach-agent-desktop"
version = "0.1.0"
description = "Einfach Agent desktop shell"
edition = "2021"

[lib]
name = "einfach_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.4", features = [] }
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"

[dev-dependencies]
tauri = { version = "2.11.4", features = ["test"] }

[profile.dev]
debug = "line-tables-only"
incremental = false
