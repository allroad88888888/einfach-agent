name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: pnpm install
      - name: Check Markdown documentation
        run: node scripts/check-docs.js
      - name: Check assembly boundaries
        run: node scripts/check-boundaries.js
      - run: pnpm test
      - run: pnpm build

  desktop-native:
    name: Desktop native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Run desktop unit and bootstrap tests
        run: cargo test --manifest-path apps/desktop/Cargo.toml
      - name: Build native desktop smoke artifact
        env:
          VITE_DEEPSEEK_API_KEY: ""
          VITE_GLM_API_KEY: ""
        run: pnpm tauri build --no-bundle --ci
